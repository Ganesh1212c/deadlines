<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadline Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14151b;
    --surface: #1c1e26;
    --surface-raised: #242631;
    --surface-hover: #2b2e3a;
    --border: #343748;
    --text: #e9e8f0;
    --text-muted: #9c9bb0;
    --text-faint: #67667c;

    --accent: #9089d1;
    --accent-strong: #b3ace3;
    --accent-ink: #14131f;

    --today: #d1b46a;
    --today-bg: #3a331f;

    --soon: #7bbfae;
    --soon-bg: #1f3430;

    --overdue: #c1798a;
    --overdue-bg: #3a2530;

    --extended: #7ea8c9;
    --extended-bg: #22303e;

    --radius-sm: 8px;
    --radius: 12px;
    --radius-lg: 16px;
    --shadow-hover: 0 10px 28px rgba(0, 0, 0, 0.35);
    --shadow-float: 0 20px 60px rgba(0, 0, 0, 0.4);

    --font-display: 'Space Grotesk', -apple-system, sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2 { margin: 0; font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0; }
  a { color: var(--accent-strong); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- Header ---------- */
  .site-header {
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid var(--border);
    background: rgba(28, 30, 38, 0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .header-inner {
    max-width: 1100px; margin: 0 auto; padding: 22px 20px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .site-title { font-size: 1.75rem; }
  .site-subtitle { margin-top: 4px; color: var(--text-muted); font-size: 0.92rem; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: var(--radius-sm);
    padding: 10px 18px;
    font-size: 0.88rem;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--surface-raised);
    color: var(--text);
    transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease, transform 100ms ease;
  }
  .btn:hover { background: var(--surface-hover); border-color: var(--text-faint); }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn-ghost { background: transparent; }
  .btn-danger:hover { border-color: var(--overdue); color: var(--overdue); }
  .nav-btn {
    border-radius: 999px; padding: 9px 20px; border: 1px solid var(--border);
    background: transparent; color: var(--text); font-size: 0.9rem; font-weight: 500;
    transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent-strong); background: var(--surface-raised); }

  /* ---------- Layout ---------- */
  .cards-wrap, .editor-main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
  .editor-top { max-width: 1100px; margin: 0 auto; padding: 20px 20px 0; }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .loading, .empty, .error { color: var(--text-muted); padding: 40px 0; grid-column: 1 / -1; }
  .error { color: var(--overdue); }

  /* ---------- Card ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--text-faint);
    border-radius: var(--radius); padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px;
    transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: var(--text-faint); }
  .card.status-upcoming { border-left-color: var(--text-faint); }
  .card.status-soon { border-left-color: var(--soon); }
  .card.status-tomorrow, .card.status-today { border-left-color: var(--today); }
  .card.status-overdue { border-left-color: var(--overdue); }

  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .card-subject { font-size: 1.2rem; line-height: 1.25; }
  .card-type {
    font-size: 0.75rem; font-weight: 500; color: var(--text-muted);
    background: var(--surface-raised); border-radius: var(--radius-sm); padding: 3px 10px; white-space: nowrap;
  }
  .card-name { color: var(--text-muted); font-size: 0.95rem; }
  .card-dates { font-size: 0.88rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .date-original { text-decoration: line-through; color: var(--text-faint); }
  .date-arrow { color: var(--text-faint); }
  .date-new { color: var(--extended); }

  .card-bottom { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .tag { font-size: 0.8rem; font-weight: 500; padding: 4px 12px; border-radius: 999px; background: var(--surface-raised); color: var(--text-muted); }
  .tag-today, .tag-tomorrow { background: var(--today-bg); color: var(--today); }
  .tag-soon { background: var(--soon-bg); color: var(--soon); }
  .tag-overdue { background: var(--overdue-bg); color: var(--overdue); }
  .tag-upcoming { background: var(--surface-raised); color: var(--text-muted); }
  .tag-extended { background: var(--extended-bg); color: var(--extended); }

  .card-actions { display: flex; gap: 8px; margin-top: 6px; }

  /* ---------- Forms ---------- */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px; margin-bottom: 24px; }
  .panel-title { font-size: 1.1rem; margin-bottom: 16px; }
  .assignment-form, .edit-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 0.85rem; color: var(--text-muted); }
  input[type="text"], input:not([type]), input[type="date"], input[type="time"], input[type="password"] {
    background: var(--surface-raised); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius-sm); padding: 9px 11px; font-size: 0.95rem; width: 100%;
    transition: border-color 150ms ease;
  }
  input:focus { border-color: var(--accent); }
  .checkbox-field { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--text-muted); }
  .edit-form { background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .edit-actions { display: flex; gap: 8px; }
  .form-error { color: var(--overdue); font-size: 0.85rem; grid-column: 1 / -1; }

  /* ---------- Passcode gate ---------- */
  .gate { display: flex; align-items: center; justify-content: center; padding: 60px 20px; }
  .gate-form {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 32px; max-width: 320px; width: 100%; display: flex; flex-direction: column; gap: 14px;
    box-shadow: var(--shadow-float);
  }
  .gate-title { font-size: 1.3rem; }
  .gate-copy { color: var(--text-muted); font-size: 0.9rem; }
  .gate-error { color: var(--overdue); font-size: 0.88rem; }

  /* ---------- Footer ---------- */
  .site-footer { max-width: 1100px; margin: 0 auto; padding: 20px; color: var(--text-faint); font-size: 0.85rem; }
  .site-footer a { color: var(--text-muted); }

  @media (max-width: 640px) {
    .header-inner { padding: 16px; }
    .cards-wrap, .editor-main { padding: 20px 14px 40px; }
    .editor-top { padding: 16px 14px 0; }
    .cards-grid { grid-template-columns: 1fr; }
    .card-top { flex-direction: column; align-items: flex-start; gap: 4px; }
  }
</style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div>
        <h1 class="site-title">Deadline Tracker</h1>
        <p class="site-subtitle" id="summary-line">Loading assignments&hellip;</p>
      </div>
      <button type="button" class="nav-btn" id="show-editor-btn">Editor</button>
    </div>
  </header>

  <main class="cards-wrap" id="board-view">
    <div id="board-cards" class="cards-grid" aria-live="polite">
      <p class="loading">Loading assignments&hellip;</p>
    </div>
  </main>

  <footer class="site-footer" id="board-footer">
    <p>Assignments are added and updated from the editor.</p>
  </footer>

  <main class="editor-main" id="editor-view" hidden>
    <div class="editor-top">
      <button type="button" class="nav-btn" id="back-to-board-btn">Back to board</button>
    </div>

    <div id="gate" class="gate">
      <form id="gate-form" class="gate-form">
        <h1 class="gate-title">Editor access</h1>
        <p class="gate-copy">Enter the passcode to add, edit, or remove assignments.</p>
        <input type="password" id="passcode-input" placeholder="Passcode" inputmode="numeric" autocomplete="off" required>
        <button type="submit" class="btn btn-primary">Unlock</button>
        <p class="gate-error" id="gate-error" hidden>Incorrect passcode.</p>
      </form>
    </div>

    <div id="editor-panel" hidden>
      <section class="panel">
        <h2 class="panel-title">Add an assignment</h2>
        <form id="add-form" class="assignment-form">
          <div class="field">
            <label for="add-subject">Subject</label>
            <input id="add-subject" required>
          </div>
          <div class="field">
            <label for="add-name">Assignment name</label>
            <input id="add-name" required>
          </div>
          <div class="field">
            <label for="add-type">Type</label>
            <input id="add-type" list="type-options" required>
            <datalist id="type-options">
              <option value="Assignment">
              <option value="Quiz">
              <option value="Test">
              <option value="Project">
              <option value="Lab report">
              <option value="Presentation">
              <option value="Exam">
              <option value="Viva">
            </datalist>
          </div>
          <div class="field">
            <label for="add-date">Due date</label>
            <input type="date" id="add-date" required>
          </div>
          <div class="field">
            <label for="add-time">Due time</label>
            <input type="time" id="add-time" value="23:59" required>
          </div>
          <button type="submit" class="btn btn-primary">Add assignment</button>
          <p class="form-error" id="add-error" hidden></p>
        </form>
      </section>

      <section class="panel">
        <h2 class="panel-title">All assignments</h2>
        <div id="editor-cards" class="cards-grid"></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ---------- Config ----------
    const SUPABASE_URL = 'https://wuyzjoasxnmrekufbluv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_5ez_V-wtEPg7aRNdNwjaFw_eSR0B5BS';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Kept only in memory — never persisted — so the passcode is required
    // again every time the editor is opened.
    let currentPasscode = null;

    // ---------- Shared: data + rendering ----------
    async function fetchAssignments() {
      const { data, error } = await supabaseClient.from('assignments').select('*');
      if (error) throw error;
      return data || [];
    }

    // Status is computed from the exact due timestamp (extended timestamp,
    // if set), so an item only flips to "Overdue" once its due time has
    // actually passed, not just its calendar date.
    function getStatus(assignment) {
      const effectiveISO = (assignment.is_extended && assignment.extended_at) ? assignment.extended_at : assignment.due_at;
      const dueDate = new Date(effectiveISO);
      const now = new Date();
      const effectiveMs = dueDate.getTime();
      const isOverdue = effectiveMs < now.getTime();

      const dueMidnight = new Date(dueDate); dueMidnight.setHours(0, 0, 0, 0);
      const nowMidnight = new Date(now); nowMidnight.setHours(0, 0, 0, 0);
      const dayDiff = Math.round((dueMidnight.getTime() - nowMidnight.getTime()) / 86400000);

      let label, statusClass;
      if (isOverdue) {
        if (dayDiff === 0) {
          label = 'Overdue today';
        } else {
          const n = Math.abs(dayDiff);
          label = `Overdue by ${n} day${n === 1 ? '' : 's'}`;
        }
        statusClass = 'overdue';
      } else if (dayDiff === 0) {
        label = 'Due today';
        statusClass = 'today';
      } else if (dayDiff === 1) {
        label = 'Due tomorrow';
        statusClass = 'tomorrow';
      } else if (dayDiff <= 3) {
        label = `Due in ${dayDiff} days`;
        statusClass = 'soon';
      } else {
        label = `Due in ${dayDiff} days`;
        statusClass = 'upcoming';
      }

      return { effectiveMs, isOverdue, dayDiff, label, statusClass };
    }

    // Nearest upcoming deadline first, down to the minute. Overdue items
    // sink below the upcoming list, with the most recently overdue closest
    // to the top of that section and the longest-overdue at the very end.
    function sortAssignments(list) {
      return [...list].sort((a, b) => {
        const sa = getStatus(a), sb = getStatus(b);
        if (sa.isOverdue !== sb.isOverdue) return sa.isOverdue ? 1 : -1;
        if (sa.isOverdue) return sb.effectiveMs - sa.effectiveMs;
        return sa.effectiveMs - sb.effectiveMs;
      });
    }

    function formatDateTime(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      const datePart = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      const timePart = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
      return `${datePart}, ${timePart}`;
    }

    function toLocalDateValue(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function toLocalTimeValue(d) {
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      return `${hh}:${mi}`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function createCardElement(assignment, options = {}) {
      const { editable = false, onEdit, onDelete } = options;
      const status = getStatus(assignment);

      const card = document.createElement('article');
      card.className = `card status-${status.statusClass}`;
      card.dataset.id = assignment.id;

      const dateHtml = (assignment.is_extended && assignment.extended_at)
        ? `<span class="date-original">${formatDateTime(assignment.due_at)}</span>
           <span class="date-arrow">&rarr;</span>
           <span class="date-new">${formatDateTime(assignment.extended_at)}</span>`
        : `<span class="date-single">${formatDateTime(assignment.due_at)}</span>`;

      card.innerHTML = `
        <div class="card-top">
          <h2 class="card-subject">${escapeHtml(assignment.subject)}</h2>
          <span class="card-type">${escapeHtml(assignment.assignment_type)}</span>
        </div>
        <p class="card-name">${escapeHtml(assignment.assignment_name)}</p>
        <div class="card-dates">${dateHtml}</div>
        <div class="card-bottom">
          <span class="tag tag-${status.statusClass}">${status.label}</span>
          ${assignment.is_extended ? '<span class="tag tag-extended">Extended</span>' : ''}
        </div>
      `;

      if (editable) {
        const actions = document.createElement('div');
        actions.className = 'card-actions';

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'btn btn-ghost';
        editBtn.textContent = 'Edit';
        editBtn.addEventListener('click', () => onEdit(assignment, card));

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn btn-ghost btn-danger';
        delBtn.textContent = 'Delete';
        delBtn.addEventListener('click', () => onDelete(assignment, card));

        actions.append(editBtn, delBtn);
        card.appendChild(actions);
      }

      return card;
    }

    async function refreshCards(container, options = {}) {
      container.innerHTML = '<p class="loading">Loading assignments&hellip;</p>';
      try {
        const list = await fetchAssignments();
        const sorted = sortAssignments(list);
        container.innerHTML = '';
        if (sorted.length === 0) {
          container.innerHTML = '<p class="empty">No assignments yet.</p>';
          return sorted;
        }
        sorted.forEach(a => container.appendChild(createCardElement(a, options)));
        return sorted;
      } catch (err) {
        container.innerHTML = `<p class="error">Couldn't load assignments: ${escapeHtml(err.message)}</p>`;
        return [];
      }
    }

    // ---------- Board view ----------
    const boardCardsEl = document.getElementById('board-cards');
    const summaryEl = document.getElementById('summary-line');

    async function updateSummary() {
      try {
        const list = await fetchAssignments();
        const overdue = list.filter(a => getStatus(a).isOverdue).length;
        const upcoming = list.length - overdue;
        summaryEl.textContent = list.length === 0
          ? 'No assignments yet.'
          : `${list.length} assignment${list.length === 1 ? '' : 's'} on the board. ${upcoming} upcoming, ${overdue} overdue.`;
      } catch (e) {
        summaryEl.textContent = '';
      }
    }

    async function tickBoard() {
      await refreshCards(boardCardsEl, { editable: false });
      await updateSummary();
    }

    tickBoard();
    setInterval(tickBoard, 60 * 1000);

    // ---------- View toggle ----------
    const boardView = document.getElementById('board-view');
    const boardFooter = document.getElementById('board-footer');
    const editorView = document.getElementById('editor-view');
    const showEditorBtn = document.getElementById('show-editor-btn');
    const backToBoardBtn = document.getElementById('back-to-board-btn');
    const gate = document.getElementById('gate');
    const gateForm = document.getElementById('gate-form');
    const gateError = document.getElementById('gate-error');
    const passcodeInput = document.getElementById('passcode-input');
    const editorPanel = document.getElementById('editor-panel');

    showEditorBtn.addEventListener('click', () => {
      boardView.hidden = true;
      boardFooter.hidden = true;
      editorView.hidden = false;
      gate.hidden = false;
      editorPanel.hidden = true;
      gateError.hidden = true;
      passcodeInput.value = '';
      passcodeInput.focus();
    });

    backToBoardBtn.addEventListener('click', async () => {
      currentPasscode = null; // passcode must be re-entered next time
      editorView.hidden = true;
      boardView.hidden = false;
      boardFooter.hidden = false;
      await tickBoard();
    });

    // ---------- Editor: passcode gate + CRUD ----------
    const editorCardsEl = document.getElementById('editor-cards');
    const addForm = document.getElementById('add-form');
    const addError = document.getElementById('add-error');

    function getPasscode() {
      return currentPasscode || '';
    }

    async function verifyPasscode(code) {
      const { data, error } = await supabaseClient.rpc('verify_passcode', { passcode: code });
      if (error) return false;
      return data === true;
    }

    gateForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      gateError.hidden = true;
      const code = passcodeInput.value.trim();
      const ok = await verifyPasscode(code);
      if (ok) {
        currentPasscode = code;
        gate.hidden = true;
        editorPanel.hidden = false;
        await loadEditorCards();
      } else {
        gateError.hidden = false;
        passcodeInput.value = '';
        passcodeInput.focus();
      }
    });

    async function loadEditorCards() {
      await refreshCards(editorCardsEl, {
        editable: true,
        onEdit: openEditForm,
        onDelete: handleDelete,
      });
    }

    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      addError.hidden = true;

      const subject = document.getElementById('add-subject').value.trim();
      const name = document.getElementById('add-name').value.trim();
      const type = document.getElementById('add-type').value.trim();
      const date = document.getElementById('add-date').value;
      const time = document.getElementById('add-time').value;
      const dueAtISO = new Date(`${date}T${time}`).toISOString();

      const { error } = await supabaseClient.rpc('add_assignment', {
        passcode: getPasscode(),
        p_subject: subject,
        p_assignment_name: name,
        p_assignment_type: type,
        p_due_at: dueAtISO,
      });

      if (error) {
        addError.textContent = `Couldn't add assignment: ${error.message}`;
        addError.hidden = false;
        return;
      }

      addForm.reset();
      document.getElementById('add-time').value = '23:59';
      await loadEditorCards();
    });

    async function handleDelete(assignment, cardEl) {
      const confirmed = confirm(`Delete "${assignment.assignment_name}" (${assignment.subject})?`);
      if (!confirmed) return;

      const { error } = await supabaseClient.rpc('delete_assignment', {
        passcode: getPasscode(),
        p_id: assignment.id,
      });

      if (error) {
        alert(`Couldn't delete: ${error.message}`);
        return;
      }
      await loadEditorCards();
    }

    function openEditForm(assignment, cardEl) {
      const dueDate = new Date(assignment.due_at);
      const extDate = assignment.extended_at ? new Date(assignment.extended_at) : null;

      const form = document.createElement('form');
      form.className = 'edit-form';
      form.innerHTML = `
        <div class="field">
          <label>Subject</label>
          <input class="e-subject" value="${escapeHtml(assignment.subject)}" required>
        </div>
        <div class="field">
          <label>Assignment name</label>
          <input class="e-name" value="${escapeHtml(assignment.assignment_name)}" required>
        </div>
        <div class="field">
          <label>Type</label>
          <input class="e-type" list="type-options" value="${escapeHtml(assignment.assignment_type)}" required>
        </div>
        <div class="field">
          <label>Due date</label>
          <input type="date" class="e-date" value="${toLocalDateValue(dueDate)}" required>
        </div>
        <div class="field">
          <label>Due time</label>
          <input type="time" class="e-time" value="${toLocalTimeValue(dueDate)}" required>
        </div>
        <label class="checkbox-field">
          <input type="checkbox" class="e-extended" ${assignment.is_extended ? 'checked' : ''}>
          Extended
        </label>
        <div class="field e-extended-date-field" ${assignment.is_extended ? '' : 'hidden'}>
          <label>New date</label>
          <input type="date" class="e-extended-date" value="${extDate ? toLocalDateValue(extDate) : ''}">
        </div>
        <div class="field e-extended-time-field" ${assignment.is_extended ? '' : 'hidden'}>
          <label>New time</label>
          <input type="time" class="e-extended-time" value="${extDate ? toLocalTimeValue(extDate) : '23:59'}">
        </div>
        <div class="edit-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-ghost btn-cancel">Cancel</button>
        </div>
        <p class="form-error e-error" hidden></p>
      `;

      const extendedCheckbox = form.querySelector('.e-extended');
      const extendedDateField = form.querySelector('.e-extended-date-field');
      const extendedTimeField = form.querySelector('.e-extended-time-field');
      extendedCheckbox.addEventListener('change', () => {
        extendedDateField.hidden = !extendedCheckbox.checked;
        extendedTimeField.hidden = !extendedCheckbox.checked;
      });

      form.querySelector('.btn-cancel').addEventListener('click', () => {
        form.replaceWith(cardEl);
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorEl = form.querySelector('.e-error');
        errorEl.hidden = true;

        const isExtended = extendedCheckbox.checked;
        const extDateVal = form.querySelector('.e-extended-date').value;
        const extTimeVal = form.querySelector('.e-extended-time').value;

        if (isExtended && (!extDateVal || !extTimeVal)) {
          errorEl.textContent = 'Pick a new date and time, or uncheck Extended.';
          errorEl.hidden = false;
          return;
        }

        const dueAtISO = new Date(`${form.querySelector('.e-date').value}T${form.querySelector('.e-time').value}`).toISOString();
        const extendedAtISO = isExtended ? new Date(`${extDateVal}T${extTimeVal}`).toISOString() : null;

        const { error } = await supabaseClient.rpc('update_assignment', {
          passcode: getPasscode(),
          p_id: assignment.id,
          p_subject: form.querySelector('.e-subject').value.trim(),
          p_assignment_name: form.querySelector('.e-name').value.trim(),
          p_assignment_type: form.querySelector('.e-type').value.trim(),
          p_due_at: dueAtISO,
          p_is_extended: isExtended,
          p_extended_at: extendedAtISO,
        });

        if (error) {
          errorEl.textContent = `Couldn't save: ${error.message}`;
          errorEl.hidden = false;
          return;
        }

        await loadEditorCards();
      });

      cardEl.replaceWith(form);
    }
  </script>
</body>
</html>
