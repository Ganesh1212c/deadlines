<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadline Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <h1 class="site-title">Deadline Tracker</h1>
        <p class="site-subtitle" id="summary-line">Loading assignments&hellip;</p>
      </div>
      <a class="editor-link" href="editor.html">Editor</a>
    </div>
  </header>

  <main class="cards-wrap">
    <div id="cards" class="cards-grid" aria-live="polite">
      <p class="loading">Loading assignments&hellip;</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>Assignments are added and updated from the <a href="editor.html">editor page</a>.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    const cardsEl = document.getElementById('cards');
    const summaryEl = document.getElementById('summary-line');

    async function updateSummary() {
      try {
        const list = await fetchAssignments();
        const upcoming = list.filter(a => getStatus(a).days >= 0).length;
        const overdue = list.length - upcoming;
        summaryEl.textContent = list.length === 0
          ? 'No assignments yet.'
          : `${list.length} assignment${list.length === 1 ? '' : 's'} on the board. ${upcoming} upcoming, ${overdue} overdue.`;
      } catch (e) {
        summaryEl.textContent = '';
      }
    }

    async function tick() {
      await refreshCards(cardsEl, { editable: false });
      await updateSummary();
    }

    tick();
    setInterval(tick, 5 * 60 * 1000);
  </script>
</body>
</html>
