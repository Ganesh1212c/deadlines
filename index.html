<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadline Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --glass: rgba(255, 255, 255, 0.035);
    --glass-strong: rgba(255, 255, 255, 0.06);
    --field: rgba(255, 255, 255, 0.045);
    --border: rgba(255, 255, 255, 0.09);
    --border-strong: rgba(255, 255, 255, 0.2);
    --text: #f5f5f7;
    --text-muted: #93939c;
    --text-faint: #5a5a63;

    --white: #ffffff;
    --white-dim: #e4e4e7;
    --black: #000000;

    --today: #e0c264;
    --soon: #6fb8ad;
    --overdue: #e0798a;
    --extended: #7aa8d9;
    --upcoming: #74747c;

    --radius-sm: 8px;
    --radius: 14px;
    --radius-lg: 20px;

    --font-display: 'Inter', -apple-system, sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    position: relative;
    min-height: 100vh;
  }
  h1, h2 { margin: 0; font-family: var(--font-display); font-weight: 700; letter-spacing: -0.015em; }
  p { margin: 0; }
  a { color: var(--text); text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }

  :focus-visible { outline: 2px solid rgba(255, 255, 255, 0.5); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  /* ---------- Header ---------- */
  .site-header {
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .header-inner {
    max-width: 900px; margin: 0 auto; padding: 26px 24px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
    position: relative; z-index: 1;
  }
  .site-title {
    font-size: 1.95rem;
    background: linear-gradient(135deg, #ffffff 10%, #c3d3ef 55%, #94e0d1 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 34px rgba(122, 168, 217, 0.25);
  }
  .site-subtitle { margin-top: 6px; color: var(--text-muted); font-size: 0.9rem; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: var(--radius-sm); padding: 10px 18px; font-size: 0.86rem; font-weight: 500;
    border: 1px solid var(--border); background: var(--glass); color: var(--text);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease, transform 100ms ease;
  }
  .btn:hover { border-color: var(--border-strong); background: var(--glass-strong); }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--white); border-color: var(--white); color: var(--black); font-weight: 600; }
  .btn-primary:hover { background: var(--white-dim); border-color: var(--white-dim); }
  .btn-danger:hover { border-color: var(--overdue); color: var(--overdue); }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .nav-btn {
    border-radius: 999px; padding: 9px 20px; border: 1px solid var(--border);
    background: var(--glass); color: var(--text); font-size: 0.88rem; font-weight: 500;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: background-color 140ms ease, border-color 140ms ease;
  }
  .nav-btn:hover { border-color: var(--border-strong); background: var(--glass-strong); }
  .nav-btn.is-on { border-color: rgba(122, 168, 217, 0.4); color: var(--extended); }

  /* ---------- Layout ---------- */
  .page-wrap, .editor-main { max-width: 900px; margin: 0 auto; padding: 40px 24px 64px; position: relative; z-index: 1; }
  .editor-top { max-width: 900px; margin: 0 auto; padding: 24px 24px 0; position: relative; z-index: 1; }
  .state-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 64px 24px; }
  .state-orb {
    position: relative; width: 40px; height: 40px; border-radius: 50%;
    background: var(--soon); color: var(--soon);
    box-shadow: 0 0 0 8px var(--bg), 0 0 36px 4px currentColor;
  }
  .state-error .state-orb { background: var(--overdue); color: var(--overdue); }
  .state-orb::after {
    content: ''; position: absolute; inset: -6px; border-radius: 50%;
    background: inherit; opacity: 0.45; animation: dot-ping 2.6s ease-out infinite;
  }
  .state-title { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--text); }
  .state-message { color: var(--text-muted); font-size: 0.92rem; max-width: 360px; }

  /* ---------- View transitions ---------- */
  @keyframes view-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .view-enter { animation: view-in 220ms ease; }

  /* ---------- Timeline ---------- */
  .timeline { position: relative; display: flex; flex-direction: column; }
  .timeline-line {
    position: absolute; left: 15px; top: 6px; bottom: 6px; width: 2px;
    background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.14) 4%, rgba(255, 255, 255, 0.14) 96%, transparent);
  }
  .timeline-node-col { width: 32px; display: flex; justify-content: center; padding-top: 22px; flex-shrink: 0; }

  @keyframes entry-in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
  .timeline-entry { position: relative; display: flex; align-items: flex-start; gap: 16px; padding: 8px 0; }
  .timeline-entry.entry-enter { animation: entry-in 340ms ease both; }

  .timeline-node {
    position: relative; width: 10px; height: 10px; border-radius: 50%; background: var(--upcoming); color: var(--upcoming);
    box-shadow: 0 0 0 4px var(--bg), 0 0 14px 2px currentColor;
  }
  .timeline-node.today { background: var(--overdue); color: var(--overdue); }
  .timeline-node.tomorrow { background: var(--today); color: var(--today); }
  .timeline-node.soon { background: var(--soon); color: var(--soon); }
  .timeline-node.overdue { background: var(--overdue); color: var(--overdue); }
  @keyframes dot-ping { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(2.8); opacity: 0; } }
  .timeline-node.today::after, .timeline-node.overdue::after {
    content: ''; position: absolute; inset: -4px; border-radius: 50%; background: inherit; animation: dot-ping 2s ease-out infinite;
  }

  .timeline-content {
    flex: 1; background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; margin-bottom: 14px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: border-color 150ms ease, background-color 150ms ease, transform 150ms ease;
    display: flex; flex-direction: column; gap: 8px;
  }
  .timeline-entry:hover .timeline-content { border-color: var(--border-strong); background: var(--glass-strong); transform: translateX(2px); }

  .entry-top { display: flex; }
  .entry-subject { font-size: 1.15rem; line-height: 1.25; overflow-wrap: break-word; }
  .entry-name { color: var(--text-muted); font-size: 0.94rem; }
  .entry-datetime {
    font-family: var(--font-mono); font-size: 0.82rem; letter-spacing: -0.01em;
    color: var(--text-muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .date-original { text-decoration: line-through; color: var(--text-faint); }
  .date-arrow { color: var(--text-faint); }
  .date-new { color: var(--extended); }

  .status-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .status-text { font-size: 0.85rem; color: var(--text-muted); }
  .status-text.today { color: var(--overdue); }
  .status-text.tomorrow { color: var(--today); }
  .status-text.soon { color: var(--soon); }
  .status-text.overdue { color: var(--overdue); }
  .status-countdown { font-family: var(--font-mono); font-size: 0.76rem; color: var(--text-faint); }
  .tag-extended {
    font-size: 0.72rem; font-weight: 500; color: var(--extended);
    border: 1px solid rgba(122, 168, 217, 0.35); border-radius: 999px; padding: 2px 10px;
  }

  .entry-actions { display: flex; gap: 8px; margin-top: 12px; }

  /* ---------- The "Now" marker ---------- */
  .now-marker { position: relative; display: flex; align-items: center; gap: 12px; padding: 4px 0 18px; }
  .now-node {
    position: relative; display: block; width: 10px; height: 10px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 0 4px var(--bg), 0 0 16px 4px rgba(255, 255, 255, 0.55);
  }
  .now-node::after {
    content: ''; position: absolute; inset: -4px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.55); animation: dot-ping 2.4s ease-out infinite;
  }
  .now-marker-label { font-family: var(--font-mono); font-size: 0.74rem; color: var(--text-muted); white-space: nowrap; }
  .now-marker-line { flex: 1; height: 1px; background: linear-gradient(to right, rgba(255, 255, 255, 0.35), transparent 92%); }

  /* ---------- Skeleton loading ---------- */
  @keyframes skeleton-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .skeleton-node { display: block; width: 10px; height: 10px; border-radius: 50%; background: var(--glass-strong); margin-top: 22px; }
  .skeleton-bar {
    height: 13px; border-radius: 6px;
    background: linear-gradient(90deg, var(--glass) 25%, var(--glass-strong) 50%, var(--glass) 75%);
    background-size: 200% 100%; animation: skeleton-shimmer 1.4s ease-in-out infinite;
  }

  /* ---------- Forms ---------- */
  .panel {
    background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 26px; margin-bottom: 28px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .panel-title { font-size: 1.1rem; margin-bottom: 18px; }
  .assignment-form, .edit-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 0.83rem; color: var(--text-muted); }
  input[type="text"], input:not([type]), input[type="password"] {
    background: var(--field); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius-sm); padding: 10px 12px; font-size: 0.95rem; width: 100%;
    transition: border-color 140ms ease;
  }
  input[type="date"], input[type="time"] {
    background: var(--field); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius-sm); padding: 10px 12px; font-size: 0.92rem; width: 100%;
    font-family: var(--font-mono); transition: border-color 140ms ease;
  }
  input:focus { border-color: rgba(255, 255, 255, 0.4); }
  .checkbox-field { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--text-muted); }
  .edit-form { background: var(--glass-strong); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
  .edit-actions { display: flex; gap: 8px; }
  .form-error { color: var(--overdue); font-size: 0.85rem; grid-column: 1 / -1; }

  /* ---------- Passcode gate ---------- */
  .gate { display: flex; align-items: center; justify-content: center; padding: 70px 20px; position: relative; z-index: 1; }
  .gate-form {
    background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 36px; max-width: 320px; width: 100%; display: flex; flex-direction: column; gap: 14px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
  }
  .gate-title { font-size: 1.3rem; }
  .gate-copy { color: var(--text-muted); font-size: 0.9rem; }
  .gate-error { color: var(--overdue); font-size: 0.88rem; }

  /* ---------- Toasts ---------- */
  @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(10px); } }
  .toast-stack {
    position: fixed; bottom: 20px; right: 20px; z-index: 300;
    display: flex; flex-direction: column; gap: 10px; align-items: flex-end; pointer-events: none;
  }
  .toast {
    background: rgba(16, 16, 20, 0.85); border: 1px solid var(--border-strong);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: var(--text); padding: 12px 18px; border-radius: var(--radius-sm);
    font-size: 0.88rem; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    animation: toast-in 200ms ease, toast-out 200ms ease 2.3s forwards;
    max-width: 300px;
  }
  .toast.error { border-color: rgba(224, 121, 138, 0.45); color: var(--overdue); }

  /* ---------- Confirm modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65);
    display: flex; align-items: center; justify-content: center; z-index: 200;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: 20px;
  }
  .modal-card {
    background: rgba(16, 16, 20, 0.9); border: 1px solid var(--border-strong); border-radius: var(--radius-lg);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding: 26px; max-width: 340px; width: 100%; display: flex; flex-direction: column; gap: 16px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  }
  .modal-title { font-size: 1.05rem; font-family: var(--font-display); font-weight: 600; }
  .modal-message { color: var(--text-muted); font-size: 0.92rem; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

  /* ---------- Footer ---------- */
  .site-footer { max-width: 900px; margin: 0 auto; padding: 20px 24px; color: var(--text-faint); font-size: 0.85rem; position: relative; z-index: 1; }

  @media (max-width: 640px) {
    .header-inner { padding: 20px 16px; }
    .page-wrap, .editor-main { padding: 32px 14px 44px; }
    .editor-top { padding: 18px 14px 0; }
    .toast-stack { left: 14px; right: 14px; align-items: stretch; }
    .toast { max-width: none; }
  }
</style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <h1 class="site-title">Deadline Tracker</h1>
        <p class="site-subtitle" id="summary-line">Loading assignments&hellip;</p>
      </div>
      <div class="header-actions">
        <button type="button" class="nav-btn" id="notify-btn">Enable notifications</button>
      </div>
    </div>
  </header>

  <main class="page-wrap" id="board-view">
    <div id="board-timeline" class="timeline" aria-live="polite"></div>
  </main>

  <footer class="site-footer" id="board-footer">
    <p>Assignments are added and updated from the editor.</p>
  </footer>

  <main class="editor-main" id="editor-view" hidden>
    <div class="editor-top">
      <button type="button" class="nav-btn" id="back-to-board-btn">Back to board</button>
    </div>

    <div id="gate" class="gate">
      <form id="gate-form" class="gate-form">
        <h1 class="gate-title">Editor access</h1>
        <p class="gate-copy">Enter the passcode to add, edit, or remove assignments.</p>
        <input type="password" id="passcode-input" placeholder="Passcode" inputmode="numeric" autocomplete="off" required>
        <button type="submit" class="btn btn-primary">Unlock</button>
        <p class="gate-error" id="gate-error" hidden>Incorrect passcode.</p>
      </form>
    </div>

    <div id="editor-panel" hidden>
      <section class="panel">
        <h2 class="panel-title">Add an assignment</h2>
        <form id="add-form" class="assignment-form">
          <div class="field">
            <label for="add-subject">Subject</label>
            <input id="add-subject" required>
          </div>
          <div class="field">
            <label for="add-name">Assignment name</label>
            <input id="add-name" required>
          </div>
          <div class="field">
            <label for="add-type">Type</label>
            <input id="add-type" list="type-options" required>
            <datalist id="type-options">
              <option value="Assignment">
              <option value="Quiz">
              <option value="Test">
              <option value="Project">
              <option value="Lab report">
              <option value="Presentation">
              <option value="Exam">
              <option value="Viva">
            </datalist>
          </div>
          <div class="field">
            <label for="add-date">Due date</label>
            <input type="date" id="add-date" required>
          </div>
          <div class="field">
            <label for="add-time">Due time</label>
            <input type="time" id="add-time" value="23:59" required>
          </div>
          <button type="submit" class="btn btn-primary">Add assignment</button>
          <p class="form-error" id="add-error" hidden></p>
        </form>
      </section>

      <section class="panel">
        <h2 class="panel-title">All assignments</h2>
        <div id="editor-timeline" class="timeline"></div>
      </section>
    </div>
  </main>

  <div class="modal-overlay" id="confirm-overlay" hidden>
    <div class="modal-card">
      <h2 class="modal-title">Delete this assignment?</h2>
      <p class="modal-message" id="confirm-message"></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="confirm-cancel-btn">Cancel</button>
        <button type="button" class="btn btn-primary btn-danger" id="confirm-ok-btn">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ---------- Config ----------
    const SUPABASE_URL = 'https://wuyzjoasxnmrekufbluv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_5ez_V-wtEPg7aRNdNwjaFw_eSR0B5BS';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Kept only in memory — never persisted — so the passcode is required
    // again every time the editor is opened.
    let currentPasscode = null;

    // ---------- Toasts ----------
    const toastStack = document.getElementById('toast-stack');
    function showToast(message, type = 'default') {
      const t = document.createElement('div');
      t.className = type === 'error' ? 'toast error' : 'toast';
      t.textContent = message;
      toastStack.appendChild(t);
      setTimeout(() => t.remove(), 2600);
    }

    // ---------- Confirm modal (replaces window.confirm) ----------
    const confirmOverlay = document.getElementById('confirm-overlay');
    const confirmMessage = document.getElementById('confirm-message');
    const confirmOkBtn = document.getElementById('confirm-ok-btn');
    const confirmCancelBtn = document.getElementById('confirm-cancel-btn');

    function showConfirm(message) {
      return new Promise((resolve) => {
        confirmMessage.textContent = message;
        confirmOverlay.hidden = false;
        function cleanup(result) {
          confirmOverlay.hidden = true;
          confirmOkBtn.removeEventListener('click', onOk);
          confirmCancelBtn.removeEventListener('click', onCancel);
          resolve(result);
        }
        function onOk() { cleanup(true); }
        function onCancel() { cleanup(false); }
        confirmOkBtn.addEventListener('click', onOk);
        confirmCancelBtn.addEventListener('click', onCancel);
      });
    }

    // ---------- Push notifications ----------
    const VAPID_PUBLIC_KEY = 'BK5Hh4LblBMcW6RQL6rYEXZYKKDKrMZpY5J88NYiNPKDu0TdbU_u_jIfCb-p68IibZ9MUYTGkugmKr1ezwmVyeM';
    const notifyBtn = document.getElementById('notify-btn');

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
    }

    function pushSupported() {
      return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    }

    async function refreshNotifyButton() {
      if (!pushSupported()) {
        notifyBtn.hidden = true;
        return;
      }
      try {
        const reg = await navigator.serviceWorker.getRegistration();
        const sub = reg ? await reg.pushManager.getSubscription() : null;
        notifyBtn.textContent = sub ? 'Notifications on' : 'Enable notifications';
        notifyBtn.classList.toggle('is-on', !!sub);
      } catch (e) {
        notifyBtn.textContent = 'Enable notifications';
      }
    }

    async function enableNotifications() {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        showToast('Notifications were blocked', 'error');
        return;
      }
      const reg = await navigator.serviceWorker.register('sw.js');
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
      const json = sub.toJSON();
      const { error } = await supabaseClient.rpc('subscribe_to_push', {
        p_endpoint: json.endpoint,
        p_p256dh: json.keys.p256dh,
        p_auth: json.keys.auth,
      });
      if (error) {
        showToast(`Couldn't save subscription: ${error.message}`, 'error');
        return;
      }
      showToast('Notifications enabled');
      await refreshNotifyButton();
    }

    async function disableNotifications() {
      const reg = await navigator.serviceWorker.getRegistration();
      const sub = reg ? await reg.pushManager.getSubscription() : null;
      if (sub) {
        const endpoint = sub.endpoint;
        await sub.unsubscribe();
        await supabaseClient.rpc('unsubscribe_from_push', { p_endpoint: endpoint });
      }
      showToast('Notifications turned off');
      await refreshNotifyButton();
    }

    notifyBtn.addEventListener('click', async () => {
      const reg = await navigator.serviceWorker.getRegistration();
      const sub = reg ? await reg.pushManager.getSubscription() : null;
      if (sub) {
        await disableNotifications();
      } else {
        try {
          await enableNotifications();
        } catch (e) {
          showToast('Could not enable notifications on this browser', 'error');
        }
      }
    });

    if (pushSupported()) {
      refreshNotifyButton();
    } else {
      notifyBtn.hidden = true;
    }

    // ---------- Shared: data + status ----------
    async function fetchAssignments() {
      const { data, error } = await supabaseClient.from('assignments').select('*');
      if (error) throw error;
      return data || [];
    }

    function formatCountdown(diffMs) {
      const absMs = Math.abs(diffMs);
      const totalMinutes = Math.floor(absMs / 60000);
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      const joined = hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
      return diffMs >= 0 ? `${joined} left` : `${joined} ago`;
    }

    // Status is computed from the exact due timestamp (extended timestamp,
    // if set), so an item only flips to "Overdue" once its due time has
    // actually passed, not just its calendar date. Anything within 24
    // hours also gets a live hour/minute countdown.
    function getStatus(assignment) {
      const effectiveISO = (assignment.is_extended && assignment.extended_at) ? assignment.extended_at : assignment.due_at;
      const dueDate = new Date(effectiveISO);
      const now = new Date();
      const effectiveMs = dueDate.getTime();
      const diffMs = effectiveMs - now.getTime();
      const isOverdue = diffMs < 0;

      const dueMidnight = new Date(dueDate); dueMidnight.setHours(0, 0, 0, 0);
      const nowMidnight = new Date(now); nowMidnight.setHours(0, 0, 0, 0);
      const dayDiff = Math.round((dueMidnight.getTime() - nowMidnight.getTime()) / 86400000);

      let label, statusClass;
      if (isOverdue) {
        if (dayDiff === 0) {
          label = 'Overdue today';
        } else {
          const n = Math.abs(dayDiff);
          label = `Overdue by ${n} day${n === 1 ? '' : 's'}`;
        }
        statusClass = 'overdue';
      } else if (dayDiff === 0) {
        label = 'Due today';
        statusClass = 'today';
      } else if (dayDiff === 1) {
        label = 'Due tomorrow';
        statusClass = 'tomorrow';
      } else if (dayDiff <= 3) {
        label = `Due in ${dayDiff} days`;
        statusClass = 'soon';
      } else {
        label = `Due in ${dayDiff} days`;
        statusClass = 'upcoming';
      }

      const countdown = Math.abs(diffMs) < 24 * 60 * 60 * 1000 ? formatCountdown(diffMs) : null;

      return { effectiveMs, isOverdue, dayDiff, label, statusClass, countdown };
    }

    // Nearest upcoming deadline first, down to the minute. Overdue items
    // sink below the upcoming list, with the most recently overdue closest
    // to the top of that section and the longest-overdue at the very end.
    function sortAssignments(list) {
      return [...list].sort((a, b) => {
        const sa = getStatus(a), sb = getStatus(b);
        if (sa.isOverdue !== sb.isOverdue) return sa.isOverdue ? 1 : -1;
        if (sa.isOverdue) return sb.effectiveMs - sa.effectiveMs;
        return sa.effectiveMs - sb.effectiveMs;
      });
    }

    function formatDateTime(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      const datePart = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      const timePart = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
      return `${datePart}, ${timePart}`;
    }

    function toLocalDateValue(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function toLocalTimeValue(d) {
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      return `${hh}:${mi}`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    // ---------- Timeline rendering ----------
    function renderTimelineSkeletons(container, count = 4) {
      container.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const entry = document.createElement('div');
        entry.className = 'timeline-entry';
        entry.innerHTML = `
          <div class="timeline-node-col"><span class="skeleton-node"></span></div>
          <div class="timeline-content">
            <div class="skeleton-bar" style="width:50%;height:17px;"></div>
            <div class="skeleton-bar" style="width:75%;margin-top:10px;"></div>
            <div class="skeleton-bar" style="width:35%;margin-top:10px;"></div>
          </div>
        `;
        container.appendChild(entry);
      }
    }

    function buildNowMarker() {
      const marker = document.createElement('div');
      marker.className = 'now-marker';
      marker.innerHTML = `
        <div class="timeline-node-col"><span class="now-node"></span></div>
        <span class="now-marker-label">Now</span>
        <div class="now-marker-line"></div>
      `;
      return marker;
    }

    function createTimelineEntry(assignment, options = {}) {
      const { editable = false, onEdit, onDelete } = options;
      const status = getStatus(assignment);

      const entry = document.createElement('div');
      entry.className = 'timeline-entry';
      entry.dataset.id = assignment.id;

      const dateHtml = (assignment.is_extended && assignment.extended_at)
        ? `<span class="date-original">${formatDateTime(assignment.due_at)}</span>
           <span class="date-arrow">&rarr;</span>
           <span class="date-new">${formatDateTime(assignment.extended_at)}</span>`
        : `<span class="date-single">${formatDateTime(assignment.due_at)}</span>`;

      entry.innerHTML = `
        <div class="timeline-node-col"><span class="timeline-node ${status.statusClass}"></span></div>
        <div class="timeline-content">
          <div class="entry-top">
            <h2 class="entry-subject">${escapeHtml(assignment.subject)}</h2>
          </div>
          <p class="entry-name">${escapeHtml(assignment.assignment_name)}, ${escapeHtml(assignment.assignment_type)}</p>
          <div class="entry-datetime">${dateHtml}</div>
          <div class="status-row">
            <span class="status-text ${status.statusClass}">${status.label}</span>
            ${status.countdown ? `<span class="status-countdown">${status.countdown}</span>` : ''}
            ${assignment.is_extended ? '<span class="tag-extended">Extended</span>' : ''}
          </div>
        </div>
      `;

      if (editable) {
        const actions = document.createElement('div');
        actions.className = 'entry-actions';

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'btn';
        editBtn.textContent = 'Edit';
        editBtn.addEventListener('click', () => onEdit(assignment, entry));

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn btn-danger';
        delBtn.textContent = 'Delete';
        delBtn.addEventListener('click', () => onDelete(assignment, entry));

        actions.append(editBtn, delBtn);
        entry.querySelector('.timeline-content').appendChild(actions);
      }

      return entry;
    }

    async function refreshTimeline(container, options = {}) {
      const { showSkeleton = true, emptyMessage = 'Once assignments are added, they will line up here.' } = options;
      if (showSkeleton) renderTimelineSkeletons(container);
      try {
        const list = await fetchAssignments();
        const sorted = sortAssignments(list);
        container.innerHTML = '';

        if (sorted.length === 0) {
          container.innerHTML = `
            <div class="state-card state-empty">
              <span class="state-orb"></span>
              <p class="state-title">Nothing here yet</p>
              <p class="state-message">${escapeHtml(emptyMessage)}</p>
            </div>
          `;
          return sorted;
        }

        const line = document.createElement('div');
        line.className = 'timeline-line';
        container.appendChild(line);

        const overdueStartIndex = sorted.findIndex(a => getStatus(a).isOverdue);

        sorted.forEach((a, i) => {
          if (overdueStartIndex !== -1 && i === overdueStartIndex) {
            container.appendChild(buildNowMarker());
          }
          const entryEl = createTimelineEntry(a, options);
          if (showSkeleton) {
            entryEl.classList.add('entry-enter');
            entryEl.style.animationDelay = `${Math.min(i, 8) * 35}ms`;
          }
          container.appendChild(entryEl);
        });

        return sorted;
      } catch (err) {
        container.innerHTML = `
          <div class="state-card state-error">
            <span class="state-orb"></span>
            <p class="state-title">Couldn't load assignments</p>
            <p class="state-message">${escapeHtml(err.message)}</p>
          </div>
        `;
        return [];
      }
    }

    // ---------- Board view ----------
    const boardTimelineEl = document.getElementById('board-timeline');
    const summaryEl = document.getElementById('summary-line');
    let boardLoadedOnce = false;

    async function updateSummary() {
      try {
        const list = await fetchAssignments();
        const overdue = list.filter(a => getStatus(a).isOverdue).length;
        const upcoming = list.length - overdue;
        summaryEl.textContent = list.length === 0
          ? 'No assignments yet.'
          : `${list.length} assignment${list.length === 1 ? '' : 's'} on the board. ${upcoming} upcoming, ${overdue} overdue.`;
      } catch (e) {
        summaryEl.textContent = '';
      }
    }

    async function tickBoard() {
      await refreshTimeline(boardTimelineEl, {
        editable: false,
        showSkeleton: !boardLoadedOnce,
        emptyMessage: 'Once assignments are added from the editor, they will line up here.',
      });
      boardLoadedOnce = true;
      await updateSummary();
    }

    tickBoard();
    setInterval(tickBoard, 60 * 1000);

    // ---------- View toggle ----------
    // No visible link to the editor anywhere on the board — the only way
    // in is knowing to visit this page with #editor on the end of the
    // URL. The passcode gate underneath is still the real security; this
    // just keeps the entry point off the public page entirely.
    const boardView = document.getElementById('board-view');
    const boardFooter = document.getElementById('board-footer');
    const editorView = document.getElementById('editor-view');
    const backToBoardBtn = document.getElementById('back-to-board-btn');
    const gate = document.getElementById('gate');
    const gateForm = document.getElementById('gate-form');
    const gateError = document.getElementById('gate-error');
    const passcodeInput = document.getElementById('passcode-input');
    const editorPanel = document.getElementById('editor-panel');

    function playEnter(el) {
      el.classList.remove('view-enter');
      void el.offsetWidth;
      el.classList.add('view-enter');
    }

    function openEditorView() {
      boardView.hidden = true;
      boardFooter.hidden = true;
      editorView.hidden = false;
      gate.hidden = false;
      editorPanel.hidden = true;
      gateError.hidden = true;
      passcodeInput.value = '';
      playEnter(editorView);
      passcodeInput.focus();
    }

    function checkEditorHash() {
      if (window.location.hash === '#editor' && editorView.hidden) {
        openEditorView();
      }
    }

    window.addEventListener('hashchange', checkEditorHash);
    checkEditorHash(); // in case the page was loaded directly on #editor

    backToBoardBtn.addEventListener('click', async () => {
      currentPasscode = null; // passcode must be re-entered next time
      editorView.hidden = true;
      boardView.hidden = false;
      boardFooter.hidden = false;
      history.replaceState(null, '', window.location.pathname + window.location.search);
      playEnter(boardView);
      await tickBoard();
    });

    // ---------- Editor: passcode gate + CRUD ----------
    const editorTimelineEl = document.getElementById('editor-timeline');
    const addForm = document.getElementById('add-form');
    const addError = document.getElementById('add-error');

    function getPasscode() {
      return currentPasscode || '';
    }

    async function verifyPasscode(code) {
      const { data, error } = await supabaseClient.rpc('verify_passcode', { passcode: code });
      if (error) return false;
      return data === true;
    }

    gateForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      gateError.hidden = true;
      const code = passcodeInput.value.trim();
      const ok = await verifyPasscode(code);
      if (ok) {
        currentPasscode = code;
        gate.hidden = true;
        editorPanel.hidden = false;
        playEnter(editorPanel);
        await loadEditorTimeline(true);
      } else {
        gateError.hidden = false;
        passcodeInput.value = '';
        passcodeInput.focus();
      }
    });

    async function loadEditorTimeline(showSkeleton = false) {
      await refreshTimeline(editorTimelineEl, {
        editable: true,
        onEdit: openEditForm,
        onDelete: handleDelete,
        showSkeleton,
        emptyMessage: 'Add your first assignment above to get started.',
      });
    }

    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      addError.hidden = true;

      const subject = document.getElementById('add-subject').value.trim();
      const name = document.getElementById('add-name').value.trim();
      const type = document.getElementById('add-type').value.trim();
      const date = document.getElementById('add-date').value;
      const time = document.getElementById('add-time').value;
      const dueAtISO = new Date(`${date}T${time}`).toISOString();

      const { error } = await supabaseClient.rpc('add_assignment', {
        passcode: getPasscode(),
        p_subject: subject,
        p_assignment_name: name,
        p_assignment_type: type,
        p_due_at: dueAtISO,
      });

      if (error) {
        addError.textContent = `Couldn't add assignment: ${error.message}`;
        addError.hidden = false;
        return;
      }

      addForm.reset();
      document.getElementById('add-time').value = '23:59';
      await loadEditorTimeline();
      showToast('Assignment added');
    });

    async function handleDelete(assignment, entryEl) {
      const confirmed = await showConfirm(`Delete "${assignment.assignment_name}" (${assignment.subject})? This can't be undone.`);
      if (!confirmed) return;

      const { error } = await supabaseClient.rpc('delete_assignment', {
        passcode: getPasscode(),
        p_id: assignment.id,
      });

      if (error) {
        showToast(`Couldn't delete: ${error.message}`, 'error');
        return;
      }
      await loadEditorTimeline();
      showToast('Assignment deleted');
    }

    function openEditForm(assignment, entryEl) {
      const dueDate = new Date(assignment.due_at);
      const extDate = assignment.extended_at ? new Date(assignment.extended_at) : null;

      const form = document.createElement('form');
      form.className = 'edit-form';
      form.innerHTML = `
        <div class="field">
          <label>Subject</label>
          <input class="e-subject" value="${escapeHtml(assignment.subject)}" required>
        </div>
        <div class="field">
          <label>Assignment name</label>
          <input class="e-name" value="${escapeHtml(assignment.assignment_name)}" required>
        </div>
        <div class="field">
          <label>Type</label>
          <input class="e-type" list="type-options" value="${escapeHtml(assignment.assignment_type)}" required>
        </div>
        <div class="field">
          <label>Due date</label>
          <input type="date" class="e-date" value="${toLocalDateValue(dueDate)}" required>
        </div>
        <div class="field">
          <label>Due time</label>
          <input type="time" class="e-time" value="${toLocalTimeValue(dueDate)}" required>
        </div>
        <label class="checkbox-field">
          <input type="checkbox" class="e-extended" ${assignment.is_extended ? 'checked' : ''}>
          Extended
        </label>
        <div class="field e-extended-date-field" ${assignment.is_extended ? '' : 'hidden'}>
          <label>New date</label>
          <input type="date" class="e-extended-date" value="${extDate ? toLocalDateValue(extDate) : ''}">
        </div>
        <div class="field e-extended-time-field" ${assignment.is_extended ? '' : 'hidden'}>
          <label>New time</label>
          <input type="time" class="e-extended-time" value="${extDate ? toLocalTimeValue(extDate) : '23:59'}">
        </div>
        <div class="edit-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-cancel">Cancel</button>
        </div>
        <p class="form-error e-error" hidden></p>
      `;

      const extendedCheckbox = form.querySelector('.e-extended');
      const extendedDateField = form.querySelector('.e-extended-date-field');
      const extendedTimeField = form.querySelector('.e-extended-time-field');
      extendedCheckbox.addEventListener('change', () => {
        extendedDateField.hidden = !extendedCheckbox.checked;
        extendedTimeField.hidden = !extendedCheckbox.checked;
      });

      form.querySelector('.btn-cancel').addEventListener('click', () => {
        form.replaceWith(entryEl);
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorEl = form.querySelector('.e-error');
        errorEl.hidden = true;

        const isExtended = extendedCheckbox.checked;
        const extDateVal = form.querySelector('.e-extended-date').value;
        const extTimeVal = form.querySelector('.e-extended-time').value;

        if (isExtended && (!extDateVal || !extTimeVal)) {
          errorEl.textContent = 'Pick a new date and time, or uncheck Extended.';
          errorEl.hidden = false;
          return;
        }

        const dueAtISO = new Date(`${form.querySelector('.e-date').value}T${form.querySelector('.e-time').value}`).toISOString();
        const extendedAtISO = isExtended ? new Date(`${extDateVal}T${extTimeVal}`).toISOString() : null;

        const { error } = await supabaseClient.rpc('update_assignment', {
          passcode: getPasscode(),
          p_id: assignment.id,
          p_subject: form.querySelector('.e-subject').value.trim(),
          p_assignment_name: form.querySelector('.e-name').value.trim(),
          p_assignment_type: form.querySelector('.e-type').value.trim(),
          p_due_at: dueAtISO,
          p_is_extended: isExtended,
          p_extended_at: extendedAtISO,
        });

        if (error) {
          errorEl.textContent = `Couldn't save: ${error.message}`;
          errorEl.hidden = false;
          return;
        }

        await loadEditorTimeline();
        showToast('Changes saved');
      });

      entryEl.replaceWith(form);
    }
  </script>
</body>
</html>
